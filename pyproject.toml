[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "camlab"
version = "0.0.1"
description = "Camera-calibration prototype: one clip in, a solved and hand-editable camera out"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",   # cKDTree, for the paint residual
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",  # the upload form; FastAPI raises at import without it
]

[project.optional-dependencies]
# Everything that needs to decode pixels. Kept out of the base install so the core geometry and
# its tests run anywhere, including in CI without media.
cv = ["opencv-python-headless>=4.9"]
dev = ["pytest>=8", "ruff==0.16.1", "httpx>=0.27", "pillow>=10"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
camlab = ["server/static/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W"]
# UP042 wants (str, Enum) -> StrEnum on the domain enums. It changes what f"{x}" renders
# (CameraSource.PLANE_FIT -> plane_fit), and these land in JSON on the wire to the browser. A
# migration with tests, not a lint autofix. pitch3d switched it off for the same reason.
ignore = ["UP042"]
